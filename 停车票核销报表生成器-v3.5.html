<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>停车票核销报表生成器 v3.5</title>
<style>
:root{
  --bg1:#eef1ff;--bg2:#f6f4ff;--bg3:#eef7ff;
  --surface:#ffffff;--surface-2:#fafaff;--surface-3:#f5f6fb;
  --text:#1a1a1a;--text-2:#6b7280;--text-3:#9ca3af;
  --border:#e5e7eb;--border-2:#eef0f5;
  --primary:#4f46e5;--primary-2:#6d28d9;--primary-soft:#eef2ff;--primary-ring:rgba(79,70,229,.18);
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn:#d97706;--warn-bg:#fffbeb;--err:#dc2626;--err-bg:#fef2f2;
  --info:#1e40af;--info-bg:#eff6ff;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 4px 6px -1px rgba(16,24,40,.06),0 2px 4px -2px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(79,70,229,.10),0 2px 8px rgba(16,24,40,.05);
  --radius:16px;--radius-sm:10px;--radius-xs:8px;
  --t:.25s cubic-bezier(.4,0,.2,1);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg1:#0b0d14;--bg2:#11131c;--bg3:#0d1018;
    --surface:#171a24;--surface-2:#1c2030;--surface-3:#222637;
    --text:#e8eaf0;--text-2:#9aa1b1;--text-3:#6b7280;
    --border:#2a2f3e;--border-2:#232838;
    --primary:#7c83ff;--primary-2:#9d6dff;--primary-soft:#1f2336;--primary-ring:rgba(124,131,255,.22);
    --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--ok-bg:#0f2a1f;--warn-bg:#2a2008;--err-bg:#2a1414;--info-bg:#13203a;
    --shadow-lg:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);-webkit-font-smoothing:antialiased}
.card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:32px 36px 28px;max-width:760px;width:100%;animation:fadeUp .5s var(--t) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:4px}
.brand .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.4);flex-shrink:0}
h1{font-size:23px;color:var(--text);text-align:center;margin-bottom:4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:13px;text-align:center;margin-bottom:22px}
.badge{display:inline-block;background:var(--ok-bg);color:var(--ok);font-size:10px;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;font-weight:600;border:1px solid rgba(22,163,74,.15)}

.steps{display:flex;margin-bottom:10px;gap:0}
.step{flex:1;text-align:center;position:relative;font-size:11px;color:var(--text-3)}
.step .dot{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--text-2);font-size:13px;font-weight:700;line-height:30px;margin:0 auto 7px;position:relative;z-index:1;transition:all var(--t);border:1px solid var(--border)}
.step .lbl{white-space:nowrap;transition:color var(--t)}
.step:not(:last-child)::after{content:'';position:absolute;top:15px;left:calc(50% + 17px);right:calc(-50% + 17px);height:3px;background:var(--border);border-radius:2px;transition:background var(--t)}
.step.done .dot{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;box-shadow:0 3px 10px var(--primary-ring);animation:pop .35s var(--t)}
.step.done:not(:last-child)::after{background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.step.done .lbl{color:var(--primary);font-weight:600}
.step.active .dot{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;box-shadow:0 0 0 5px var(--primary-ring);animation:breathe 1.8s ease-in-out infinite}
.step.active .lbl{color:var(--primary);font-weight:600}
.step.ready .dot{border-color:var(--primary);color:var(--primary)}
@keyframes pop{0%{transform:scale(.7)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 5px var(--primary-ring)}50%{box-shadow:0 0 0 9px rgba(79,70,229,.08)}}

.progress{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-bottom:20px}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .3s var(--t);position:relative}
.progress .bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.progress .bar.idle::after{animation-play-state:paused}

.upload-row{display:flex;gap:14px;margin-bottom:12px}
.upload-box{flex:1;border:2px dashed var(--border);border-radius:var(--radius-sm);padding:24px 12px;text-align:center;cursor:pointer;transition:all var(--t);position:relative;background:var(--surface)}
.upload-box:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.upload-box.has-file{border-color:var(--primary);border-style:solid;background:var(--primary-soft)}
.upload-box.dragover{border-color:var(--primary);background:var(--primary-soft);transform:scale(1.02);box-shadow:0 0 0 4px var(--primary-ring)}
.upload-box .icon{font-size:30px;margin-bottom:8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}
.upload-box .title{font-size:13.5px;color:var(--text);font-weight:600}
.upload-box .hint{font-size:11px;color:var(--text-3);margin-top:4px}
.upload-box .fn{font-size:11.5px;color:var(--primary);margin-top:8px;display:none;word-break:break-all;font-weight:600}
.upload-box .meta{font-size:10.5px;color:var(--text-3);margin-top:2px;display:none}
.upload-box .rm{position:absolute;top:8px;right:8px;width:22px;height:22px;border:none;border-radius:50%;background:var(--err-bg);color:var(--err);font-size:11px;line-height:22px;cursor:pointer;display:none;z-index:2;transition:transform var(--t)}
.upload-box .rm:hover{transform:scale(1.15)}
.upload-box.has-file .rm{display:block}
.upload-box.has-file .fn{display:block}
.upload-box.has-file .meta{display:block}
.upload-box.bad{border-color:var(--err);background:var(--err-bg)}
.upload-box.bad .fn{color:var(--err)}
.upload-box.validating{border-color:var(--primary);border-style:solid;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--primary-ring)}50%{box-shadow:0 0 0 7px var(--primary-ring)}}
.upload-box input{display:none}

.preview{margin-top:0;margin-bottom:14px;padding:11px 16px;border-radius:var(--radius-sm);background:var(--primary-soft);color:var(--primary);font-size:12.5px;text-align:center;display:none;border:1px solid rgba(79,70,229,.12);font-weight:500}
.preview b{font-weight:700}

.toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.gear{border:1px solid var(--border);background:var(--surface);color:var(--primary);border-radius:var(--radius-xs);padding:6px 12px;font-size:12px;cursor:pointer;transition:all var(--t);font-weight:500}
.gear:hover{border-color:var(--primary);background:var(--primary-soft)}
.panel{display:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:14px;background:var(--surface-2);animation:fadeUp .3s var(--t) both}
.panel.open{display:block}
.panel h3{font-size:13px;color:var(--text);margin-bottom:12px}
.panel .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
.panel .row{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2);padding:8px 10px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-xs)}
.panel .row .top{display:flex;align-items:center;gap:6px}
.panel .row .top span{font-weight:600;color:var(--text)}
.panel .row input{width:64px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:right;background:var(--surface);color:var(--text)}
.panel .row input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.panel .row .fnprev{font-size:10.5px;color:var(--primary);word-break:break-all;min-height:13px}
.panel .acts{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.panel .acts button{border-radius:var(--radius-xs);padding:6px 13px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all var(--t);font-weight:500}
.panel .acts button:hover{border-color:var(--primary);color:var(--primary)}
.panel .acts button.primary{border-color:var(--primary);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.panel .acts button.primary:hover{filter:brightness(1.08)}

.btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;transition:all var(--t);margin-top:4px}
.btn-go{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:none;box-shadow:0 6px 18px rgba(79,70,229,.32)}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(79,70,229,.4)}
.btn-go:active{transform:translateY(0)}
.btn-go:disabled{background:var(--surface-3);color:var(--text-3);cursor:not-allowed;box-shadow:none;transform:none}
.btn-cancel{background:var(--err-bg);color:var(--err);border:1px solid rgba(220,38,38,.2);cursor:pointer}
.btn-cancel:hover{background:var(--err);color:#fff;border-color:var(--err)}

.status{margin-top:14px;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;display:none;text-align:center;font-weight:500;animation:fadeUp .25s var(--t) both}
.status.ok{background:var(--ok-bg);color:var(--ok);display:block;border:1px solid rgba(22,163,74,.15)}
.status.err{background:var(--err-bg);color:var(--err);display:block;border:1px solid rgba(220,38,38,.15)}
.status.info{background:var(--info-bg);color:var(--info);display:block;border:1px solid rgba(30,64,175,.12)}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(79,70,229,.25);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;color:var(--text-3);font-size:12px;padding:6px 0 14px;display:none}
.empty.shown{display:block;animation:fadeUp .3s var(--t) both}

.result{margin-top:16px;display:none;max-height:520px;overflow-y:auto}
.result.shown{display:block;animation:fadeUp .35s var(--t) both}
.result::-webkit-scrollbar{width:8px}
.result::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.succhead{text-align:center;padding:18px 0 14px;border-bottom:1px solid var(--border-2);margin-bottom:14px}
.succheck{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--ok),#0d9b6e);color:#fff;font-size:28px;line-height:54px;margin:0 auto 10px;box-shadow:0 8px 20px rgba(22,163,74,.35);animation:pop .4s var(--t) both}
.succtitle{font-size:17px;font-weight:700;color:var(--text);margin-bottom:3px}
.succsub{font-size:12px;color:var(--text-2)}
.sumbar{display:flex;gap:8px;margin-bottom:14px}
.sumbar .cell{flex:1;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--radius-xs);padding:9px 8px;text-align:center}
.sumbar .cell .n{font-size:17px;font-weight:700;color:var(--primary)}
.sumbar .cell .l{font-size:10.5px;color:var(--text-3);margin-top:2px}
.sumbar .cell.amt .n{color:var(--ok)}
.grp{margin-bottom:14px}
.grp .gh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;padding:0 2px}
.grp .gh .gi{font-size:14px}
.grp .gh .gc{font-size:11px;font-weight:500;color:var(--text-3);background:var(--surface-3);padding:1px 7px;border-radius:99px}
.fcards{display:flex;flex-direction:column;gap:7px}
.fcard{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-xs);transition:all var(--t);animation:slideIn .3s var(--t) both}
.fcard:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);transform:translateX(2px)}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fcard .fi{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.fcard .fmain{flex:1;min-width:0}
.fcard .fname{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fmeta{font-size:10.5px;color:var(--text-3);margin-top:2px}
.fcard .fmeta .amt{color:var(--ok);font-weight:600}
.fcard .fmeta .skip{color:var(--warn)}
.fcard .fmeta .tag{display:inline-block;background:var(--surface-3);color:var(--text-2);padding:0 6px;border-radius:99px;margin-right:5px;font-size:10px}
.dlbtn{border:1px solid var(--border);background:var(--surface);color:var(--primary);border-radius:var(--radius-xs);padding:7px 11px;font-size:12px;cursor:pointer;transition:all var(--t);font-weight:600;flex-shrink:0;white-space:nowrap}
.dlbtn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.fcard.skip .dlbtn{display:none}
.ziprow{margin-top:6px;text-align:center;padding-top:14px;border-top:1px solid var(--border-2)}
.zipbtn{border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-radius:var(--radius-xs);padding:10px 22px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 5px 14px rgba(79,70,229,.3);transition:all var(--t)}
.zipbtn:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(79,70,229,.4)}
.acts2{margin-top:12px;text-align:center}
.ghost{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:var(--radius-xs);padding:7px 16px;font-size:12px;cursor:pointer;transition:all var(--t);font-weight:500}
.ghost:hover{border-color:var(--err);color:var(--err)}

.dropOverlay{display:none;position:fixed;inset:0;background:rgba(79,70,229,.14);backdrop-filter:blur(3px);z-index:50;align-items:center;justify-content:center;pointer-events:none}
.dropOverlay .inner{border:3px dashed var(--primary);border-radius:20px;background:var(--surface);padding:44px 64px;font-size:18px;color:var(--primary);font-weight:600;box-shadow:var(--shadow-lg)}
.footer{text-align:center;margin-top:20px;font-size:11px;color:var(--text-3)}
@media(max-width:640px){.card{padding:24px 20px}.upload-row{flex-direction:column}.panel .grid{grid-template-columns:1fr 1fr}.step .lbl{font-size:10px}.sumbar{flex-wrap:wrap}.sumbar .cell{flex:1 1 40%}}

</style>
</head>
<body>
<div class="card">
<div class="brand"><div class="logo">&#x1F17F;&#xFE0F;</div><h1>停车票核销报表 v3.5</h1></div>
<p class="sub">上传核销记录表 + 车辆进出报表 &#x2192; 一键生成 12 个文件<span class="badge">离线可用</span></p>
<div class="steps" id="steps">
<div class="step" id="st0"><div class="dot">1</div><div class="lbl">读取解析</div></div>
<div class="step" id="st1"><div class="dot">2</div><div class="lbl">主报表</div></div>
<div class="step" id="st2"><div class="dot">3</div><div class="lbl">商家计费</div></div>
<div class="step" id="st3"><div class="dot">4</div><div class="lbl">集团/车场</div></div>
</div>
<div class="progress" id="progress"><div class="bar" id="bar"></div></div>
<div class="upload-row">
<div class="upload-box" id="box1" onclick="document.getElementById('f1').click()">
<button class="rm" id="rm1" onclick="event.stopPropagation();rmFile(1)" title="移除">&#x2715;</button>
<div class="icon">&#x1F4CB;</div><div class="title">核销记录表</div>
<div class="hint">含「停车票核销记录报表」</div>
<div class="fn" id="nm1"></div><div class="meta" id="mt1"></div><input type="file" id="f1" accept=".xlsx,.xls"/>
</div>
<div class="upload-box" id="box2" onclick="document.getElementById('f2').click()">
<button class="rm" id="rm2" onclick="event.stopPropagation();rmFile(2)" title="移除">&#x2715;</button>
<div class="icon">&#x1F697;</div><div class="title">车辆进出报表</div>
<div class="hint">含「车辆进出报表」</div>
<div class="fn" id="nm2"></div><div class="meta" id="mt2"></div><input type="file" id="f2" accept=".xlsx,.xls"/>
</div>
</div>
<div class="empty" id="empty">把两个文件拖到上方任意框，或点击选择 — 放反了会自动互换</div>
<div class="preview" id="preview"></div>
<div class="toolbar"><button class="gear" id="gear" onclick="togglePanel()">&#x2699;&#xFE0F; 单价设置</button></div>
<div class="panel" id="panel">
<h3>商家单价设置 <span style="font-weight:400;color:var(--text-3);font-size:11px">（保存后记忆，文件名同步更新）</span></h3>
<div class="grid" id="priceGrid"></div>
<div class="acts">
<button onclick="savePrices()" class="primary">保存单价</button>
<button onclick="resetPrices()">恢复默认</button>
<button onclick="togglePanel()">收起</button>
</div>
</div>
<button class="btn btn-go" id="btn" onclick="run()">&#x26A1; 一键生成全部报表</button>
<div class="status" id="status"></div>
<div class="result" id="summary"></div>
<div class="footer">停车票报表生成器 v3.5 · 纯浏览器运行，数据不上传 · 可把两个文件一起拖到页面任意处</div>
</div>
<div class="dropOverlay" id="dropOverlay"><div class="inner">&#x1F4C2; 松开以自动识别并填入两个文件</div></div>


<script>
/**

var DEFAULT_PRICES={'爱康':10,'爱康口腔':16,'爱来':5,'阿玛施':5,'歌蕊':13,'皆大欢洗':3,'新奥美嘉':10,'丝芭':16,'精应':4};
var PRICE_KEY='v33_merchant_prices';
function loadPrices(){var s=null;try{s=localStorage.getItem(PRICE_KEY);}catch(e){}if(!s)return;try{var o=JSON.parse(s);Object.keys(MERCHANT_FILES).forEach(function(k){if(o[k]!=null&&Number(o[k])>=0)MERCHANT_FILES[k].price=Number(o[k]);});}catch(e){}}
loadPrices();
function togglePanel(){var p=document.getElementById('panel');p.classList.toggle('open');if(p.classList.contains('open'))renderPriceGrid();}
function renderPriceGrid(){
  var g=document.getElementById('priceGrid');g.innerHTML='';
  Object.keys(MERCHANT_FILES).forEach(function(k){
    var cfg=MERCHANT_FILES[k];
    var d=document.createElement('div');d.className='row';
    var top=document.createElement('div');top.className='top';
    var lab=document.createElement('span');lab.textContent=k;
    var inp=document.createElement('input');inp.type='number';inp.min='0';inp.step='0.5';inp.id='price_'+k;inp.value=cfg.price;
    var unit=document.createElement('span');unit.textContent='元/张';unit.style.color='var(--text-3)';
    var prev=document.createElement('div');prev.className='fnprev';prev.id='fnprev_'+k;
    function upd(){prev.textContent='→ '+cfg.base+(Number(inp.value)||0)+'元.xlsx';}
    inp.oninput=function(){cfg.price=Number(inp.value)||0;upd();};
    upd();
    top.appendChild(lab);top.appendChild(inp);top.appendChild(unit);
    d.appendChild(top);d.appendChild(prev);g.appendChild(d);
  });
}
function savePrices(){var o={};Object.keys(MERCHANT_FILES).forEach(function(k){var v=Number(document.getElementById('price_'+k).value);if(!isNaN(v)&&v>=0)o[k]=v;});try{localStorage.setItem(PRICE_KEY,JSON.stringify(o));}catch(e){}Object.keys(o).forEach(function(k){MERCHANT_FILES[k].price=o[k];});toast('✅ 单价已保存，文件名已同步','ok');}
function resetPrices(){Object.keys(MERCHANT_FILES).forEach(function(k){MERCHANT_FILES[k].price=DEFAULT_PRICES[k];});try{localStorage.removeItem(PRICE_KEY);}catch(e){}renderPriceGrid();toast('✅ 已恢复默认单价','ok');}
function toast(msg,cls){var st=document.getElementById('status');st.className='status '+cls;st.textContent=msg;st.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){if(st.className.indexOf('info')<0)st.style.display='none';},2500);}

// ==== HELPERS ====
function dcpy(o){return JSON.parse(JSON.stringify(o));}
function scell(ws,c,r,style){var ref=COL[c]+(r+1);if(!ws[ref])ws[ref]={v:null};ws[ref].s=dcpy(style);}
function byKW(rows,kw){return rows.filter(function(r){return r[3]&&String(r[3]).indexOf(kw)>=0;});}
function byAcct(rows,accts){return rows.filter(function(r){return accts.has(String(r[7]||''));});}
function byHours(rows,min,max){return rows.filter(function(r){var v=Number(r[1]);return !isNaN(v)&&v>=min&&v<=max;});}
function ton(v){if(v==null||v==='')return NaN;if(typeof v==='number')return v;return Number(v);}
function rnd(v,d){if(v==null||v===''||isNaN(Number(v)))return'';return Number(Number(v).toFixed(d||2));}
function dOnly(v){if(!v)return new Date(NaN);if(v instanceof Date)return new Date(v.getFullYear(),v.getMonth(),v.getDate());if(typeof v==='number')return new Date(Math.round((v-25569)*86400*1000));var m=String(v).trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));var d=new Date(v);return isNaN(d.getTime())?new Date(NaN):new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dStr(d){if(!d)return '';if(typeof d==='string'){var p=dOnly(d);if(!isNaN(p.getTime()))d=p;else return d;}if(typeof d==='number')d=dOnly(d);if(!(d instanceof Date)||isNaN(d.getTime()))return String(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function tStr(v){if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v.getTime()))return [v.getHours(),v.getMinutes(),v.getSeconds()].map(function(x){return String(x).padStart(2,'0');}).join(':');if(typeof v==='number'&&v>0&&v<1){var sec=Math.round(v*86400);return [Math.floor(sec/3600),Math.floor((sec%3600)/60),sec%60].map(function(x){return String(x).padStart(2,'0');}).join(':');}return String(v).replace(/\.0$/,'');}
function normRow(r){var out=r.slice(0,9);var bv=ton(out[1]);if(!isNaN(bv))out[1]=bv;if(out[4]!=null&&out[4] instanceof Date&&!isNaN(out[4].getTime()))out[4]=dStr(out[4]);else if(out[4]!=null&&!(out[4] instanceof Date)){var d4=dOnly(out[4]);if(!isNaN(d4.getTime()))out[4]=dStr(d4);}if(out[5]!=null)out[5]=tStr(out[5]);return out;}
function buildPivot(rows,valIdx){var groups=new Map(),total=0;for(var i=0;i<rows.length;i++){var r=rows[i],val=ton(r[valIdx]);if(isNaN(val))continue;total+=val;var d=r[4]?dOnly(r[4]):null;var key=d&&!isNaN(d.getTime())?d.getTime():'blank';groups.set(key,(groups.get(key)||0)+val);}var entries=[];groups.forEach(function(v,k){if(k!=='blank')entries.push([dStr(new Date(k)),v]);});entries.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});return {entries:entries,total:rnd(total,2)};}
function bufSize(d){if(d==null)return 0;if(typeof d.byteLength==='number')return d.byteLength;if(typeof d.length==='number')return d.length;return 0;}
function fmtSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';}
function fmtNum(n){if(n==null||isNaN(n))return '0';return Number(n).toLocaleString('zh-CN');}

function formatSheet(ws,opts){var nc=opts.numCols,w=opts.widths,de=opts.dataEndRow,pe=opts.pivotEndRow,tr=opts.totalRow;ws['!cols']=[];for(var i=0;i<nc;i++)ws['!cols'].push({wch:w[i]||12});ws['!rows']=[];ws['!rows'][0]={hpt:30};for(var c=0;c<nc;c++){if(c<=8||c>=11)scell(ws,c,0,S_HDR);}var lastR=Math.max(de,pe!=null?pe:0,tr!=null?tr:0);for(var r=1;r<=lastR;r++){ws['!rows'][r]={hpt:18};if(r<=de){var sA=(r%2===1)?S_R1:S_R2;for(var cA=0;cA<=8;cA++)scell(ws,cA,r,sA);}if(pe!=null&&r<=pe){var sL=(r%2===1)?S_PV1:S_PV2;for(var cL=11;cL<nc;cL++)scell(ws,cL,r,sL);}if(tr!=null&&r===tr){for(var cT=11;cT<nc;cT++)scell(ws,cT,r,S_TTL);ws['!rows'][r]={hpt:28};}}}

function buildDataOnly(data){var s=[];s.push(HEADERS.slice());for(var i=0;i<data.length;i++)s.push(normRow(data[i]));return {data:s,dataEndRow:data.length,pivotEndRow:null,totalRow:null};}
function buildMerchant(data,pivot,label){var s=[],ps=11,nc=ps+2,hdr=HEADERS.slice();while(hdr.length<ps)hdr.push('');hdr.push('日期',label);s.push(hdr);var pe=pivot.entries.length,maxRows=Math.max(data.length,pe+1);for(var i=0;i<maxRows;i++){var row=[];if(i<data.length)row.push.apply(row,normRow(data[i]));while(row.length<ps)row.push('');if(i<pe)row.push(pivot.entries[i][0],pivot.entries[i][1]);else if(i===pe)row.push('合计',pivot.total);while(row.length<nc)row.push('');s.push(row);}return {data:s,dataEndRow:data.length,pivotEndRow:pe,totalRow:pe+1};}
function buildTime3Or24(data,bVal,label){var s=[],ps=11,nc=ps+2,hdrs=HEADERS.concat(['B']),hdr=hdrs.slice();while(hdr.length<ps)hdr.push('');hdr.push('日期',label);s.push(hdr);var enriched=[];for(var i=0;i<data.length;i++)enriched.push(normRow(data[i]).concat([bVal]));var pivot=buildPivot(enriched,9),pe=pivot.entries.length;var maxRows=Math.max(data.length,pe+1);for(var i2=0;i2<maxRows;i2++){var row=[];if(i2<data.length)row.push.apply(row,enriched[i2]);while(row.length<ps)row.push('');if(i2<pe)row.push(pivot.entries[i2][0],pivot.entries[i2][1]);else if(i2===pe)row.push('合计',pivot.total);while(row.length<nc)row.push('');s.push(row);}return {data:s,dataEndRow:data.length,pivotEndRow:pe,totalRow:pe+1};}
function buildTimeOverNoPivot(data){var nc=11;var hdrs=HEADERS.concat(['B','张']),s=[hdrs.slice()];for(var i=0;i<data.length;i++){var r=normRow(data[i]),ting=ton(r[1])||0;s.push(r.concat([rnd(ting/12,2),Math.ceil(ting/12)]));}return {data:s,dataEndRow:data.length,pivotEndRow:null,totalRow:null};}
function buildTime12(data,floorName,timeData){var s24=floorName+'24小时',sOver=floorName+'大于一天',d24=timeData[s24]||[],dOver=timeData[sOver]||[];var e12=[];for(var i=0;i<data.length;i++)e12.push(normRow(data[i]).concat([1]));var e24=[];for(var i2=0;i2<d24.length;i2++)e24.push(normRow(d24[i2]).concat([2]));var eOz=[];for(var i3=0;i3<dOver.length;i3++){var r3=normRow(dOver[i3]),t3=ton(r3[1])||0;eOz.push(r3.concat([rnd(t3/12,2),Math.ceil(t3/12)]));}var p12=buildPivot(e12,9),p24=buildPivot(e24,9),pOz=buildPivot(eOz,10);var dateMap={};[{l:'12h',d:p12.entries},{l:'24h',d:p24.entries},{l:'oz',d:pOz.entries}].forEach(function(p){for(var i4=0;i4<p.d.length;i4++){var dk=p.d[i4][0]||'(空白)',dv=p.d[i4][1];if(!dateMap[dk])dateMap[dk]={};dateMap[dk][p.l]=dv;}});var sd=Object.keys(dateMap).filter(function(k){return k!=='(空白)';}).sort();if(dateMap['(空白)'])sd.push('(空白)');var sheet=[],as=11,ah=['日期','12小时B','24小时B','大于一天张','合计'],nc=as+ah.length;var hdr=HEADERS.concat(['B']);while(hdr.length<as)hdr.push('');hdr.push.apply(hdr,ah);sheet.push(hdr);var s12=0,s24c=0,sO2=0,sHj=0,pe=sd.length;var maxRows=Math.max(data.length,pe+1);for(var i5=0;i5<maxRows;i5++){var row=[];if(i5<data.length)row.push.apply(row,e12[i5]);while(row.length<as)row.push('');if(i5<pe){var dd=sd[i5],vals=dateMap[dd]||{},v12=vals['12h']||0,v24=vals['24h']||0,voz=vals['oz']||0,vhj=v12+v24+voz;s12+=v12;s24c+=v24;sO2+=voz;sHj+=vhj;row.push(dd,v12,v24,voz,vhj);}else if(i5===pe){row.push('合计',s12,s24c,sO2,sHj);}while(row.length<nc)row.push('');sheet.push(row);}return {data:sheet,dataEndRow:data.length,pivotEndRow:pe,totalRow:pe+1};}

// ==== STEP 1: MAIN REPORT ====
function step1_mainReport(rows,onProgress){
  var md={};Object.keys(MERCHANT_KW).forEach(function(n){md[n]=byKW(rows,MERCHANT_KW[n]);});
  var jAll=byKW(rows,'九号行馆'),j6f=byAcct(jAll,F6),j4f=byAcct(jAll,F4),j35f=byAcct(jAll,F35),j46f=byAcct(jAll,F46);
  var jGroup=j35f.concat(j46f),jJiuhao=jAll.filter(function(r){return !F35.has(String(r[7]||''))&&!F46.has(String(r[7]||''));});
  var fm={'6楼':j6f,'4楼':j4f,'35楼':j35f,'46楼':j46f},td={};
  Object.keys(fm).forEach(function(fn){Object.keys(TIME_RANGES).forEach(function(tk){td[fn+tk]=byHours(fm[fn],TIME_RANGES[tk][0],TIME_RANGES[tk][1]);});});
  var wb=XLSX.utils.book_new(),sum={},failed=[],STDW=[14,8,18,24,16,8,14,16,10];
  SHEET_ORDER.forEach(function(sn,idx){
    var result=null,widths=STDW.slice();
    try{
      if(sn===MAIN_SHEET){result=buildDataOnly(rows);widths=STDW.slice();sum[sn]=rows.length;}
      else if(sn in MERCHANT_KW){var d=md[sn];result=buildMerchant(d,buildPivot(d,1),'求和项:停');widths=STDW.concat([12,12,14,14]);sum[sn]=d.length;}
      else if(sn==='集团'){result=buildMerchant(jGroup,buildPivot(jGroup,1),'求和项:停');widths=STDW.concat([12,12,14,14]);sum[sn]=jGroup.length;}
      else if(sn==='九号'){result=buildDataOnly(jJiuhao);widths=STDW.slice();sum[sn]=jJiuhao.length;}
      else if(sn==='九号6楼'){result=buildDataOnly(j6f);widths=STDW.slice();sum[sn]=j6f.length;}
      else if(sn==='九号4楼'){result=buildDataOnly(j4f);widths=STDW.slice();sum[sn]=j4f.length;}
      else if(sn.indexOf('大于一天')>=0){var dO2=td[sn]||[];result=buildTimeOverNoPivot(dO2);widths=STDW.concat([8,6]);sum[sn]=dO2.length;}
      else if(sn.indexOf('3小时')>=0){var d3=td[sn]||[];result=buildTime3Or24(d3,1,'求和项:B');widths=STDW.concat([8,12,14,14]);sum[sn]=d3.length;}
      else if(sn.indexOf('24小时')>=0){var d24=td[sn]||[];result=buildTime3Or24(d24,2,'求和项:B');widths=STDW.concat([8,12,14,14]);sum[sn]=d24.length;}
      else{var d12=td[sn]||[];result=buildTime12(d12,sn.replace('12小时',''),td);widths=STDW.concat([8,12,14,14,14,14,12]);sum[sn]=d12.length;}
    }catch(e){failed.push({sn:sn,err:e&&e.message?e.message:String(e)});sum[sn]='⚠️失败';result={data:[HEADERS.slice(),['⚠️ 该子表生成失败:',e&&e.message?e.message:String(e)]],dataEndRow:1,pivotEndRow:null,totalRow:null};widths=STDW.slice();}
    var ws=XLSX.utils.aoa_to_sheet(result.data);
    formatSheet(ws,{numCols:widths.length,widths:widths,dataEndRow:result.dataEndRow,pivotEndRow:result.pivotEndRow,totalRow:result.totalRow});
    XLSX.utils.book_append_sheet(wb,ws,sn);
    if(onProgress)onProgress(idx+1,SHEET_ORDER.length);
  });
  return {wb:wb,sum:sum,failed:failed};
}

function readPivotLM(ws){if(!ws||!ws['!ref'])return[];var ref=XLSX.utils.decode_range(ws['!ref']),data=[];for(var r=1;r<=ref.e.r;r++){var lc=ws[COL[11]+(r+1)],vc=ws[COL[12]+(r+1)];if(!lc||!vc||lc.v==null||lc.v===undefined)continue;var label=String(lc.v);if(label==='总计'||label==='合计'||label==='(空白)'||label==='发放时间'||label==='日期'||label==='求和项:停'||label==='求和项:B'||label==='')continue;var val=ton(vc.v);if(isNaN(val)||val===0)continue;data.push({date:label,qty:Math.round(val)});}return data;}
function read12hTotal(ws){if(!ws||!ws['!ref'])return[];var ref=XLSX.utils.decode_range(ws['!ref']),data=[];for(var r=1;r<=ref.e.r;r++){var lc=ws[COL[11]+(r+1)],pc=ws[COL[15]+(r+1)];if(!lc||!pc||lc.v==null||lc.v===undefined)continue;var label=String(lc.v);if(label==='日期'||label==='总计'||label==='合计'||label==='')continue;var val=ton(pc.v);if(isNaN(val))continue;data.push({date:label,total:Math.round(val)});}return data;}

async function addHeaderToXlsxBuf(buf) {
  try {
    var zip = await JSZip.loadAsync(new Uint8Array(buf));
    var sheetFiles = Object.keys(zip.files).filter(function(fn) {
      return /^xl\/worksheets\/sheet\d+\.xml$/.test(fn);
    });
    if (sheetFiles.length === 0) return buf;

    // Count existing VML files
    var vmlCount = 0;
    Object.keys(zip.files).forEach(function(fn) {
      if (/^xl\/drawings\/vmlDrawing\d+\.vml$/.test(fn)) vmlCount++;
    });
    vmlCount++;
    var vmlNum = vmlCount;
    var vmlFn = 'xl/drawings/vmlDrawing' + vmlNum + '.vml';
    var vmlRelsFn = 'xl/drawings/_rels/vmlDrawing' + vmlNum + '.vml.rels';

    var NS_REL = 'http://schemas.openxmlformats.org/package/2006/relationships';
    var H_PT = (1.59 * 28.35).toFixed(2);  // 45.08pt
    var W_PT = (3.74 * 28.35).toFixed(2);  // 106.03pt

    // ----- Step 1: Fix page setup on every sheet -----
    for (var si = 0; si < sheetFiles.length; si++) {
      var sheetKey = sheetFiles[si];
      var txt = await zip.file(sheetKey).async('string');

      // 1a. Force pageSetUpPr fitToPage="1"
      if (/<pageSetUpPr/.test(txt)) {
        txt = txt.replace(/<pageSetUpPr[^>]*\/>/g, '<pageSetUpPr fitToPage="1"/>');
      } else if (/<sheetPr/.test(txt)) {
        txt = txt.replace(/<sheetPr(\/?)>/g, '<sheetPr$1><pageSetUpPr fitToPage="1"/>');
      } else {
        txt = txt.replace('<worksheet', '<worksheet><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');
      }

      // 1b. Force pageSetup (remove scale, set fit)
      txt = txt.replace(/<pageSetup[^/]*\/>/g,
        '<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="1"/>');
      if (!/<pageSetup/.test(txt)) {
        txt = txt.replace('</worksheet>',
          '<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="1"/></worksheet>');
      }

      // 1c. Force printOptions
      txt = txt.replace(/<printOptions[^/]*\/>/g,
        '<printOptions horizontalCentered="1" verticalCentered="0"/>');
      if (!/<printOptions/.test(txt)) {
        txt = txt.replace('</worksheet>',
          '<printOptions horizontalCentered="1" verticalCentered="0"/></worksheet>');
      }

      // 1d. Force pageMargins
      txt = txt.replace(/<pageMargins[^/]*\/>/g,
        '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>');
      if (!/<pageMargins/.test(txt)) {
        txt = txt.replace('</worksheet>',
          '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/></worksheet>');
      }

      // 1e. Force headerFooter &L&G
      var HF_XML = '<headerFooter><oddHeader>&amp;L</oddHeader><oddFooter /><evenHeader /><evenFooter /><firstHeader /><firstFooter /></headerFooter>';
      if (/<headerFooter/.test(txt)) {
        txt = txt.replace(/<headerFooter[\s\S]*?<\/headerFooter>/, HF_XML);
      } else {
        txt = txt.replace('</worksheet>', HF_XML + '</worksheet>');
      }

      // 1f. Remove old legacyDrawing/HF, add new legacyDrawingHF
      txt = txt.replace(/<legacyDrawingHF[^>]*\/>/g, '');
      txt = txt.replace(/<legacyDrawing[^>]*\/>/g, '');

      // Determine next VML rel ID
      var sheetBase = sheetKey.split('/').pop();
      var sheetRelsFn = 'xl/worksheets/_rels/' + sheetBase + '.rels';
      var nextRid = 1;
      if (zip.file(sheetRelsFn)) {
        var relsText = await zip.file(sheetRelsFn).async('string');
        var rids = relsText.match(/rId(\d+)/g);
        if (rids) {
          rids.forEach(function(r) {
            var n = parseInt(r.replace('rId',''));
            if (n >= nextRid) nextRid = n + 1;
          });
        }
      }

      // Add legacyDrawingHF for VML header image
      txt = txt.replace('</worksheet>',
        '<legacyDrawingHF r:id="rId' + nextRid + '"/></worksheet>');
      zip.file(sheetKey, txt);

      // Add VML relationship
      var vmlRelEl = '<Relationship Id="rId' + nextRid + '" ' +
        'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/vmlDrawing" ' +
        'Target="../drawings/vmlDrawing' + vmlNum + '.vml"/>';
      if (zip.file(sheetRelsFn)) {
        var exRels = await zip.file(sheetRelsFn).async('string');
        if (exRels.indexOf('vmlDrawing') < 0) {
          exRels = exRels.replace('</Relationships>', vmlRelEl + '</Relationships>');
          zip.file(sheetRelsFn, exRels);
        }
      } else {
        var relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
          '<Relationships xmlns="' + NS_REL + '">\n ' + vmlRelEl + '\n</Relationships>';
        zip.file(sheetRelsFn, relsXml);
      }
    }

    // ----- Step 2: VML drawing (shared header image) -----
    var vml = '<xml xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">\n' +
      ' <o:shapelayout v:ext="edit">\n  <o:idmap v:ext="edit" data="1"/>\n </o:shapelayout>\n' +
      ' <v:shapetype id="_x0000_t75" coordsize="21600,21600" o:spt="75" o:preferrelative="t"\n   path="m@4@5l@4@11@9@11@9@5xe" filled="f" stroked="f">\n' +
      '  <v:stroke joinstyle="miter"/>\n  <v:formulas>\n   <v:f eqn="if lineDrawn pixelLineWidth 0"/>\n' +
      '   <v:f eqn="sum @0 1 0"/>\n   <v:f eqn="sum 0 0 @1"/>\n   <v:f eqn="prod @2 1 2"/>\n' +
      '   <v:f eqn="prod @3 21600 pixelWidth"/>\n   <v:f eqn="prod @3 21600 pixelHeight"/>\n' +
      '   <v:f eqn="sum @0 0 1"/>\n   <v:f eqn="prod @6 1 2"/>\n   <v:f eqn="prod @7 21600 pixelWidth"/>\n' +
      '   <v:f eqn="prod @7 21600 pixelHeight"/>\n  </v:formulas>\n' +
      '  <v:path o:extrusionok="f" gradientshapeok="t" o:connecttype="rect"/>\n' +
      '  <o:lock v:ext="edit" aspectratio="t"/>\n </v:shapetype>\n' +
      ' <v:shape id="_x0000_s1025" type="#_x0000_t75" style="position:absolute;margin-left:0;margin-top:0;width:' + W_PT + 'pt;height:' + H_PT + 'pt;z-index:1">\n' +
      '  <v:imagedata o:title="logo" r:id="rId1"/>\n' +
      '  <o:lock v:ext="edit" rotation="t"/>\n </v:shape>\n</xml>';
    zip.file(vmlFn, vml);

    var vmlRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="' + NS_REL + '">\n' +
      ' <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/logo.jpg"/>\n' +
      '</Relationships>';
    zip.file(vmlRelsFn, vmlRels);

    // Logo image
    zip.file('xl/media/logo.jpg', LOGO_BASE64, {base64: true});

    // ----- Step 3: DrawingML floating image at A1 (openpyxl-compatible) -----
    var drawingNum = 1;
    Object.keys(zip.files).forEach(function(fn) {
      var m = fn.match(/^xl\/drawings\/drawing(\d+)\.xml$/);
      if (m) drawingNum = Math.max(drawingNum, parseInt(m[1]) + 1);
    });
    var drawingFn = 'xl/drawings/drawing' + drawingNum + '.xml';
    var drawingRelsFn = 'xl/drawings/_rels/drawing' + drawingNum + '.xml.rels';

    // Exact DrawingML from openpyxl
    var drawingXml = '<wsDr xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing">' +
      '<oneCellAnchor><from><col>0</col><colOff>0</colOff><row>0</row><rowOff>0</rowOff></from>' +
      '<ext cx="1343025" cy="571500"/>' +
      '<pic><nvPicPr><cNvPr id="1" name="Logo" descr="Picture"/><cNvPicPr/></nvPicPr>' +
      '<blipFill><a:blip cstate="print" r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></blipFill>' +
      '<spPr><a:prstGeom prst="rect"/></spPr></pic>' +
      '<clientData/></oneCellAnchor></wsDr>';
    zip.file(drawingFn, drawingXml);

    var drawingRels = '<Relationships xmlns="' + NS_REL + '">' +
      '<Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" ' +
      'Target="../media/logo.jpg" Id="rId1"/></Relationships>';

    // Add drawing to each sheet + enlarge row 1 for logo
    for (var si2 = 0; si2 < sheetFiles.length; si2++) {
      var sk2 = sheetFiles[si2];
      var sx = await zip.file(sk2).async('string');
      var sb2 = sk2.split('/').pop();
      var srFn = 'xl/worksheets/_rels/' + sb2 + '.rels';

      // Find next drawing rel ID
      var nextDRid = 1;
      if (zip.file(srFn)) {
        var rt = await zip.file(srFn).async('string');
        var rds = rt.match(/rId(\d+)/g);
        if (rds) rds.forEach(function(r) {
          var n = parseInt(r.replace('rId',''));

      // Add drawing element (openpyxl format)
      if (!/<drawing /.test(sx)) {
        sx = sx.replace('</worksheet>',
          '<drawing xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="rId' + nextDRid + '" /></worksheet>');

      // Add drawing relationship
      var dRel = '<Relationship Id="rId' + nextDRid + '" ' +
        'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" ' +
        'Target="../drawings/drawing' + drawingNum + '.xml"/>';
      if (zip.file(srFn)) {
        var exR = await zip.file(srFn).async('string');
        if (exR.indexOf('drawing' + drawingNum) < 0) {

          zip.file(srFn, exR);
        }
      } else {
        var rXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
          '<Relationships xmlns="' + NS_REL + '">\n ' + dRel + '\n</Relationships>';
        zip.file(srFn, rXml);
      }

      // Enlarge row 1 for logo (48pt)
      if (!/<row r="1"/.test(sx)) {
        sx = sx.replace('<sheetData>', '<sheetData><row r="1" ht="48" customHeight="1"/>');
        zip.file(sk2, sx);
      }
    }

    // ----- Step 4: Update Content_Types -----
    var ctFile = zip.file('[Content_Types].xml');
    if (ctFile) {
      var ctXml = await ctFile.async('string');

      // VML
      var vmlPart = '/xl/drawings/vmlDrawing' + vmlNum + '.vml';
      if (ctXml.indexOf(vmlPart) < 0) {
        ctXml = ctXml.replace('</Types>',
          '<Override PartName="' + vmlPart + '" ContentType="application/vnd.openxmlformats-officedocument.vmlDrawing"/></Types>');
      }
      // Drawing
      var dPart = '/xl/drawings/drawing' + drawingNum + '.xml';
      if (ctXml.indexOf(dPart) < 0) {
        ctXml = ctXml.replace('</Types>',
          '<Override PartName="' + dPart + '" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');
      }
      // JPG
      if (ctXml.indexOf('Extension="jpg"') < 0) {
        ctXml = ctXml.replace('</Types>',
          '<Default Extension="jpg" ContentType="image/jpeg"/></Types>');
      }

      zip.file('[Content_Types].xml', ctXml);
    }

    var newBuf = await zip.generateAsync({type: 'array', compression: 'DEFLATE'});
    return newBuf;
  } catch(e) {

  }

// ==== Page setup post-processing for non-merchant files ====
async function addPageFitToXlsxBuf(buf) {
  try {
    var zip = await JSZip.loadAsync(new Uint8Array(buf));
    var sheetFiles = Object.keys(zip.files).filter(function(fn) {
      return /^xl\/worksheets\/sheet\d+\.xml$/.test(fn);
    });
    // Process all sheets
    for (var i = 0; i < sheetFiles.length; i++) {
      var sheetKey = sheetFiles[i];
      var sheetXml = await zip.file(sheetKey).async('string');

      // Ensure pageSetUpPr has fitToPage="1" (Excel: 将工作表打印在一页)
      if (/<pageSetUpPr/.test(sheetXml)) {
        sheetXml = sheetXml.replace(/<pageSetUpPr[^>]*/g, '<pageSetUpPr fitToPage="1"');
      } else if (/<sheetPr>/.test(sheetXml)) {
        sheetXml = sheetXml.replace(/<sheetPr>/, '<sheetPr><pageSetUpPr fitToPage="1"/>');
      }

      // Add printOptions
      if (!/<printOptions/.test(sheetXml)) {
        sheetXml = sheetXml.replace('</worksheet>', '<printOptions horizontalCentered="1" verticalCentered="0"/></worksheet>');
      }

      // Add pageSetup
      if (!/<pageSetup/.test(sheetXml)) {
        sheetXml = sheetXml.replace('</worksheet>', '<pageSetup paperSize="9" fitToWidth="1" fitToHeight="1"/></worksheet>');
      } else {
        sheetXml = sheetXml.replace(/<pageSetup([^>]*)/, '<pageSetup$1 paperSize="9" fitToWidth="1" fitToHeight="1"');
      }

      zip.file(sheetKey, sheetXml);
    }
    // 7. Add DrawingML floating logo at A1 (v3.5 — visible header in WPS/Excel)
    var drawingNum = 1;
    Object.keys(zip.files).forEach(function(fn) {
      var m = fn.match(/^xl\/drawings\/drawing(\d+)\.xml$/);
      if (m) drawingNum = Math.max(drawingNum, parseInt(m[1]) + 1);
    });
    var drawingFn = 'xl/drawings/drawing' + drawingNum + '.xml';
    var drawingRelsFn = 'xl/drawings/_rels/drawing' + drawingNum + '.xml.rels';

    // Logo dimensions in EMU (3.74cm x 1.59cm)
    var _LOGO_EMU_W = Math.round(3.74 * 360000);
    var _LOGO_EMU_H = Math.round(1.59 * 360000);

    // DrawingML for floating logo at A1
    var drawingXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing"\n' +
      '          xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"\n' +
      '          xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">\n' +
      ' <oneCellAnchor>\n' +
      '  <from><col>0</col><colOff>0</colOff><row>0</row><rowOff>0</rowOff></from>\n' +
      '  <ext cx="' + _LOGO_EMU_W + '" cy="' + _LOGO_EMU_H + '"/>\n' +
      '  <pic>\n' +
      '   <nvPicPr><cNvPr id="1" name="Logo" descr="Picture"/><cNvPicPr/></nvPicPr>\n' +
      '   <blipFill><a:blip cstate="print" r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></blipFill>\n' +
      '   <spPr><a:prstGeom prst="rect"/>' + _LOGO_EMU_W + '" cy="' + _LOGO_EMU_H + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></spPr>\n' +
      '  </pic>\n' +
      '  <clientData/>\n' +
      ' </oneCellAnchor>\n' +
      '</wsDr>';
    zip.file(drawingFn, drawingXml);

    // Drawing rels
    var logoRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">\n' +
      ' <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/logo.jpg"/>\n' +
      '</Relationships>';
    zip.file(drawingRelsFn, logoRels);

    // Add drawing reference to each sheet
    for (var si2 = 0; si2 < sheetFiles.length; si2++) {
      var sk = sheetFiles[si2];
      var sXml = await zip.file(sk).async('string');
      var sBase = sk.split('/').pop();
      var sRelsFn = 'xl/worksheets/_rels/' + sBase + '.rels';

      // Next rel ID for drawing
      var nextDRid = 1;
      if (zip.file(sRelsFn)) {
        var rt = await zip.file(sRelsFn).async('string');
        var rds = rt.match(/rId(\d+)/g);
        if (rds) rds.forEach(function(r) { var n = parseInt(r.replace('rId','')); if (n >= nextDRid) nextDRid = n + 1; });
      }

      // Add <drawing> element before </worksheet>
      if (!/<drawing/.test(sXml)) {
        sXml = sXml.replace('</worksheet>', '<drawing xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="rId' + nextDRid + '" /></worksheet>');
        zip.file(sk, sXml);
      }

      // Add drawing relationship
      var dRel = '<Relationship Id="rId' + nextDRid + '" ' +
        'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" ' +
        'Target="../drawings/drawing' + drawingNum + '.xml"/>';
      if (zip.file(sRelsFn)) {
        var exR = await zip.file(sRelsFn).async('string');
        exR = exR.replace('</Relationships>', dRel + '</Relationships>');
        zip.file(sRelsFn, exR);
      } else {
        var rXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">\n ' + dRel + '\n</Relationships>';
        zip.file(sRelsFn, rXml);
      }
    }

    // Update content types for drawing
    var ctF2 = zip.file('[Content_Types].xml');
    if (ctF2) {
      var ctX2 = await ctF2.async('string');
      var dPart = '/xl/drawings/drawing' + drawingNum + '.xml';
      if (ctX2.indexOf(dPart) < 0) {
        ctX2 = ctX2.replace('</Types>',
          '<Override PartName="' + dPart + '" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');
      }
      zip.file('[Content_Types].xml', ctX2);
    }

    // Enlarge row 1 to host the logo (48pt so it doesn't overlap content)
    for (var si3 = 0; si3 < sheetFiles.length; si3++) {
      var sk3 = sheetFiles[si3];
      var sx3 = await zip.file(sk3).async('string');
      // If no explicit row 1 height, add it
      if (!/<row r="1"/.test(sx3)) {
        sx3 = sx3.replace('<sheetData>', '<sheetData><row r="1" ht="48" customHeight="1"/>');
        zip.file(sk3, sx3);
      }
    }

    var newBuf = await zip.generateAsync({type: 'array', compression: 'DEFLATE'});
    return newBuf;
  } catch(e) {
    console.warn('addPageFitToXlsxBuf:', e);
    return buf;
  }
}

async function run(){
  var f1el=document.getElementById('f1'),f2el=document.getElementById('f2');
  if(!f1el.files[0]||!f2el.files[0])return;
  var btn=document.getElementById('btn'),sum=document.getElementById('summary');
  _abortFlag=false;
  btn.className='btn btn-cancel';btn.innerHTML='✕ 取消生成';btn.disabled=false;
  btn.onclick=function(){_abortFlag=true;btn.disabled=true;btn.innerHTML='取消中...';};
  sum.classList.remove('shown');sum.style.display='none';sum.innerHTML='';
  setInfo('读取文件中...',3);setStep(0);
  if(_totalTimer)clearTimeout(_totalTimer);
  var timedOut=false;
  _totalTimer=setTimeout(function(){timedOut=true;showError('处理超时（90秒），请重试；若反复出现请把文件发给我排查');btn.className='btn btn-go';btn.innerHTML='⚡ 一键生成全部报表';btn.disabled=false;btn.onclick=function(){run();};},90000);
  try{
    curStep='读取解析';
    var w1=await loadWbAsync(f1el);var w2=await loadWbAsync(f2el);
    if(timedOut||_abortFlag)return;
    if(!w1)throw new Error('核销记录表解析失败');
    if(!w2)throw new Error('车辆进出报表解析失败');
    curStep='解析核销记录表';setInfo('解析核销记录表...',6);await yieldFrame();
    var wsIn=w1.Sheets[MAIN_SHEET];if(!wsIn)throw new Error('找不到「'+MAIN_SHEET+'」');
    var raw=XLSX.utils.sheet_to_json(wsIn,{header:1,defval:null,raw:true}),hd=0;
    for(var i=0;i<Math.min(raw.length,10);i++){if(raw[i]&&String(raw[i][0]).indexOf('车场')>=0){hd=i;break;}}
    var rows=raw.slice(hd+1).filter(function(r){return r[0]!=null&&r[0]!=='';});
    for(var ri=0;ri<rows.length;ri++){var rr=rows[ri],bv=ton(rr[1]);if(!isNaN(bv))rr[1]=bv;if(rr[4]!=null&&!(rr[4] instanceof Date)){var d4=dOnly(rr[4]);if(!isNaN(d4.getTime()))rr[4]=d4;}}
    curStep='解析车辆进出报表';setInfo('解析车辆进出报表...',8);await yieldFrame();
    var wsV=w2.Sheets[VEH_SHEET];if(!wsV)throw new Error('找不到「'+VEH_SHEET+'」');
    var vr=XLSX.utils.sheet_to_json(wsV,{header:1,defval:null,raw:true}),vh=0;
    for(var iv=0;iv<Math.min(vr.length,10);iv++){if(vr[iv]&&String(vr[iv][0]).indexOf('车场')>=0){vh=iv;break;}}
    var vehRows=vr.slice(vh+1).filter(function(r){return r[1]!=null&&r[1]!=='';});
    var minD=null,maxD=null;rows.forEach(function(r){var dd=dOnly(r[4]);if(!isNaN(dd.getTime())){if(!minD||dd<minD)minD=dd;if(!maxD||dd>maxD)maxD=dd;}});
    var period=dStr(minD)+' 至 '+dStr(maxD);
    curStep='生成主报表';setStep(1);setInfo('生成主报表 0/'+SHEET_ORDER.length+'...',10);await yieldFrame();
    var mainR=step1_mainReport(rows,function(done,total){setInfo('生成主报表 '+done+'/'+total+'...',10+Math.round(done/total*45));});
    var mainBuf=XLSX.write(mainR.wb,{bookType:'xlsx',type:'array',cellStyles:true});
    var allF=[{name:f1el.files[0].name.replace(/\.(xlsx|xls)$/i,'')+'_停车票核销报表.xlsx',data:mainBuf,size:bufSize(mainBuf),kind:'main'}];
    if(_abortFlag)return;
    curStep='生成商家计费';setStep(2);setInfo('生成商家计费文件...',60);await yieldFrame();
    allF=allF.concat(await step2_merchantFiles(mainR.wb,period));
    if(_abortFlag)return;
    curStep='生成集团/九号报表';setStep(3);setInfo('生成集团/九号报表...',78);await yieldFrame();
    allF.push(step3_jituanReport(mainR.wb,period));
    if(_abortFlag)return;
    setInfo('生成车场报表...',92);await yieldFrame();
    allF.push(step4_chechangReport(mainR.wb,vehRows));
    if(_abortFlag)return;
    if(timedOut)return;
    await Promise.all(allF.filter(function(f){return f.kind==='集团'||f.kind==='车场';}).map(function(f){
      return addHeaderToXlsxBuf(f.data).then(function(d){f.data=d;f.size=(d&&d.byteLength)||0;});
    }));
    setStepAllDone();setInfo('打包下载中...',97);
    var zip=new JSZip();allF.forEach(function(f){zip.file(f.name,f.data,{binary:true});});
    var zipBlob=await zip.generateAsync({type:'blob'});
    if(timedOut)return;
    clearTimeout(_totalTimer);_totalTimer=null;
    _lastFiles=allF;_lastZipBlob=zipBlob;_lastZipName=f1el.files[0].name.replace(/\.(xlsx|xls)$/i,'')+'_报表合集.zip';
    var ok=triggerDownload(zipBlob,_lastZipName);
    renderResults(allF,mainR);
    setOk('✅ 生成完成，共 '+allF.length+' 个文件'+(ok?'，已开始下载合集 zip':'（自动下载被拦截，请点下方按钮逐个保存）'));
  }catch(err){
    if(_totalTimer){clearTimeout(_totalTimer);_totalTimer=null;}
    showError('['+curStep+'] '+(err&&err.message?err.message:err));
    console.error(err);
  }finally{
    btn.className='btn btn-go';btn.innerHTML='⚡ 一键生成全部报表';btn.disabled=false;
    btn.onclick=function(){run();};
  }
}

function sb(box,fi,nm,mt,need){
  ['dragenter','dragover'].forEach(function(ev){box.addEventListener(ev,function(e){e.preventDefault();box.classList.add('dragover');});});
  ['dragleave','drop'].forEach(function(ev){box.addEventListener(ev,function(e){e.preventDefault();box.classList.remove('dragover');});});

  var r=!!(fi1.files[0]&&fi2.files[0])&&!!_cache.f1&&!!_cache.f2;
  document.getElementById('btn').style.display=r?'block':'none';
  document.getElementById('empty').classList.toggle('shown',!r);
  var st0=document.getElementById('st0');
  if(r){st0.classList.add('ready');}else{st0.classList.remove('ready');setProgress(0);}
  if(r){showPreview();}else{document.getElementById('preview').style.display='none';document.getElementById('status').style.display='none';var sm=document.getElementById('summary');sm.classList.remove('shown');sm.style.display='none';}
}

// 整页拖拽
(function(){
  var overlay=document.getElementById('dropOverlay');var dragCount=0;
  window.addEventListener('dragenter',function(e){if(e.dataTransfer&&e.dataTransfer.types&&Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0){e.preventDefault();dragCount++;overlay.style.display='flex';}});
  window.addEventListener('dragover',function(e){if(e.dataTransfer&&e.dataTransfer.types&&Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0){e.preventDefault();e.dataTransfer.dropEffect='copy';}});
  window.addEventListener('dragleave',function(e){dragCount--;if(dragCount<=0){dragCount=0;overlay.style.display='none';}});
  window.addEventListener('drop',function(e){e.preventDefault();dragCount=0;overlay.style.display='none';if(e.target&&e.target.closest&&e.target.closest('.upload-box'))return;var fs=e.dataTransfer.files;if(!fs||!fs.length)return;var assigned={};Array.prototype.forEach.call(fs,function(f){var r=new FileReader();r.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'});var hasMain=wb.SheetNames.indexOf(MAIN_SHEET)>=0;var hasVeh=wb.SheetNames.indexOf(VEH_SHEET)>=0;var target=hasMain?'f1':(hasVeh?'f2':null);if(!target||assigned[target])return;assigned[target]=true;var el=document.getElementById(target);setInputFiles(el,f);el.dispatchEvent(new Event('change'));}catch(err){}};r.readAsArrayBuffer(f);});});
})();

if(typeof XLSX==='undefined'||typeof JSZip==='undefined'){showError('依赖库加载失败，请检查文件是否完整');document.getElementById('btn').style.display='none';}
